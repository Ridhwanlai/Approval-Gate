# Render blueprint for Para's free public demo (the "Try it live" box on the website).
# Free instance: no disk and nothing stored. It sleeps after 15 idle minutes and wakes on the next
# visit in about a minute. HR_API_KEY is marked sync: false, so Render asks for it in its own form at
# deploy time and it never lives in this file.
# The paid, multi-firm service has its own blueprint: deploy/render-paid.yaml (see DEPLOY.md).
services:
  - type: web
    name: para-demo
    runtime: python
    plan: free
    buildCommand: python3 --version   # standard library only: nothing to install
    startCommand: python3 run.py serve-demo
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PARA_DATA_DIR
        value: /tmp/para
      - key: HR_MAX_CONCURRENT
        value: "2"           # the HarnessRouter Free plan runs 2 tasks at once
      - key: DEMO_ORIGINS
        value: https://ridhwanlai.github.io
      - key: DEMO_PER_VISITOR
        value: "5"
      - key: DEMO_PER_DAY
        value: "100"
      - key: HR_API_KEY
        sync: false
