# Keeps the free Render demo server (para-demo) awake so website visitors never wait for a cold start.
# Render's free plan sleeps a service after 15 idle minutes. GitHub runs scheduled jobs late at busy
# times, so pinging every 5 minutes leaves room for a delay and still lands inside that window.
# Free on a public repo; one service running all month stays inside Render's 750 free hours.
name: Keep demo awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-demo-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the demo server
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 https://para-demo.onrender.com/health; then
              echo; exit 0
            fi
            sleep 10
          done
          echo "Demo server did not answer" >&2
          exit 1
